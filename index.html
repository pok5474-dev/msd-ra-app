<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근골격계 유해요인조사·위험성평가 통합 웹앱</title>
<style>
:root{--navy:#1F3864;--blue:#DDEBF7;--yel:#FFF2CC;--gray:#F2F2F2;--line:#BFBFBF;--red:#FFC7CE;--redt:#9C0006;--amb:#FFEB9C;--ambt:#9C5700;--grn:#C6EFCE;--grnt:#006100}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:13px;color:#222;background:#fafafa}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;font-weight:700;cursor:pointer}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{background:#2E4C85;color:#fff;border:1px solid #5B79B5;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.modes button.on{background:#fff;color:var(--navy);font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:#E9EEF7;border-bottom:1px solid #C9D3E6;position:sticky;top:48px;z-index:9}
.tabs button{border:1px solid #AFC0DE;background:#fff;border-radius:5px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{padding:16px;max-width:1500px;margin:0 auto}
h2{font-size:17px;color:#fff;background:var(--navy);padding:8px 12px;margin:0 0 6px}
.note{background:var(--blue);padding:8px 12px;font-size:12px;color:#404040;margin-bottom:12px;line-height:1.55}
h3{font-size:14px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:3px;margin:18px 0 8px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;background:#fff}
th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:5px 6px;border:1px solid #8090B0;white-space:nowrap}
th.wr{white-space:normal}
td{border:1px solid var(--line);padding:3px 4px;vertical-align:middle}
td.lab{background:var(--blue);font-weight:600;white-space:nowrap}
td.auto{background:var(--gray);text-align:center}
td.auto.l{text-align:left}
td.b{font-weight:700;color:var(--navy)}
input,select,textarea{font-family:inherit;font-size:12.5px;border:1px solid #D9C98F;background:var(--yel);padding:3px 4px;border-radius:3px;width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy)}
input.n{width:58px;text-align:center}
td select{min-width:58px}
td.w select{min-width:120px}
input[type=date]{width:128px}
textarea{min-height:34px;resize:vertical}
.pnote{display:none;white-space:pre-wrap;font-size:11.5px;line-height:1.55}
@media print{.pnote{display:block}}
textarea[data-k="reg.stop"]{min-height:84px}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.btn.p{background:var(--navy);color:#fff}
.btn.d{border-color:#C00000;color:#C00000}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.g-상,.g-부담작업,.g-1순위,.g-고위험,.g-매우높음,.g-높음{background:var(--red)!important;color:var(--redt);font-weight:700}
.g-중,.g-2순위,.g-위험증가,.g-보통{background:var(--amb)!important;color:var(--ambt);font-weight:700}
.g-하,.g-비해당,.g-3순위,.g-안전,.g-낮음,.g-무시가능{background:var(--grn)!important;color:var(--grnt);font-weight:700}
.memo{color:#9C0006;font-size:11.5px}
.adj{background:var(--amb)!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.kpi{background:#fff;border:1px solid #C9D3E6;border-radius:8px;padding:10px}
.kpi .t{font-size:12px;color:#555}.kpi .v{font-size:22px;font-weight:700;color:var(--navy);margin-top:4px}
.bars .bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bars .bar span.n{width:130px;font-size:12px}
.bars .bar div{height:16px;background:#4F81BD;border-radius:3px}.bars .bar div.r{background:#C0504D}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.card{background:#fff;border:1px solid #C9D3E6;border-radius:10px;padding:14px}
.card h4{margin:0 0 6px;color:var(--navy);font-size:15px}
.card p{margin:0 0 10px;color:#555;font-size:12.5px;line-height:1.5}
.card .btn{margin:2px 2px 0 0}
.photo{border:1px solid var(--line);background:#fff;height:300px;display:flex;align-items:center;justify-content:center;color:#AAA;position:relative}
.photo img{max-width:100%;max-height:100%}
.sign td{height:44px}
.warn{background:#FFF4E5;border:1px solid #F0B46A;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:12.5px}
footer{font-size:11px;color:#777;text-align:center;padding:20px}
@media print{
  header,.tabs,.noprint,footer{display:none!important}
  body{background:#fff;font-size:10.5px}
  main{padding:0;max-width:none}
  input:not([type=checkbox]),select,textarea{border:none;background:transparent;padding:0;-webkit-appearance:none;appearance:none;resize:none}
  ::placeholder{color:transparent}
  input::-webkit-calendar-picker-indicator{display:none}
  .note{display:none}
  .photo{height:210px!important}
  .detail{position:static!important;width:auto!important}
  table.keep,h4+table{page-break-inside:avoid}
  .wrap{overflow:visible}
  @page{size:A4 landscape;margin:10mm}
  body.portrait{}
  table{page-break-inside:auto} tr{page-break-inside:avoid}
}
/*PW-CSS*/#pw{position:fixed;inset:0;background:rgba(20,30,50,.55);z-index:999;display:flex;justify-content:center;font-size:15px}
#pw .pw-box{background:#fff;width:100%;max-width:600px;display:flex;flex-direction:column;height:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media(min-width:900px){#pw .pw-box{max-width:920px;margin:18px;border-radius:12px;height:calc(100% - 36px);overflow:hidden}}
#pw .pw-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1F3864;color:#fff}
#pw .pw-tt{flex:1;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pw .pw-x{background:transparent;border:0;color:#fff;font-size:22px;width:44px;height:44px;cursor:pointer}
#pw .pw-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #DDE3EA;flex-wrap:wrap}
#pw .pw-prog{display:flex;gap:3px;flex:1;min-width:120px}
#pw .pw-prog i{flex:1;height:8px;border-radius:4px;background:#DDE3EA;cursor:pointer}
#pw .pw-prog i.d{background:#9DC3E6}#pw .pw-prog i.c{background:#2F75B5}
#pw .pw-badge{color:#fff;font-weight:700;font-size:13px;padding:5px 10px;border-radius:14px;white-space:nowrap}
#pw .pw-mode{border:1px solid #2F75B5;background:#fff;color:#2F75B5;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
#pw .pw-body{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
#pw .pw-h{font-size:21px;margin:6px 0 4px;color:#1F3864}
#pw .pw-q{font-size:16px;margin:4px 0 12px;color:#222;line-height:1.45}
#pw .pw-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){#pw .pw-opts.n4,#pw .pw-opts.n3{grid-template-columns:repeat(4,1fr)}#pw .pw-opts.n3{grid-template-columns:repeat(3,1fr)}}
#pw .pw-opts.c{grid-template-columns:repeat(4,1fr);gap:6px}
#pw .pw-opt{border:2px solid #DDE3EA;background:#fff;border-radius:12px;padding:8px 6px 10px;cursor:pointer;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
#pw .pw-opts.c .pw-opt{min-height:0;padding:4px 3px 6px}
#pw .pw-opt.on{border:3px solid #2F75B5;background:#EAF2FB;box-shadow:0 0 0 2px #BDD7EE}
#pw .pw-fig{width:100%;max-width:150px}#pw .pw-opts.c .pw-fig{max-width:84px}
#pw .pw-svg{width:100%;height:auto;display:block}
#pw .pw-lab{font-weight:700;font-size:15px;line-height:1.3;color:#1a1a1a}#pw .pw-opts.c .pw-lab{font-size:12.5px}
#pw .pw-sub{font-size:12.5px;color:#666;line-height:1.3}#pw .pw-opts.c .pw-sub{display:none}
#pw .pw-adjt{margin:16px 0 6px;font-weight:700;color:#1F3864;font-size:14px}
#pw .pw-adjs,#pw .pw-miss{display:flex;flex-direction:column;gap:8px}
#pw .pw-adj{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border:2px solid #DDE3EA;border-radius:10px;background:#fff;cursor:pointer;text-align:left;font-size:15px;font-family:inherit}
#pw .pw-adj.on{border-color:#E8590C;background:#FDF0E9}
#pw .pw-chk{width:26px;height:26px;border:2px solid #9AA5B1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex:none}
#pw .pw-adj.on .pw-chk{background:#E8590C;border-color:#E8590C}
#pw .pw-adl{flex:1;line-height:1.35}#pw .pw-d{font-weight:800;color:#E8590C;white-space:nowrap}
#pw .pw-same{width:100%;min-height:48px;margin:0 0 10px;border:2px dashed #2F75B5;background:#F3F8FD;color:#1F3864;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#pw .pw-kneefig{display:flex;gap:6px;max-width:220px}
#pw .pw-foot{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #DDE3EA;background:#fff}
#pw .pw-bt{flex:1;min-height:54px;border-radius:10px;border:2px solid #9AA5B1;background:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
#pw .pw-bt.p{flex:2;background:#2F75B5;border-color:#2F75B5;color:#fff}
#pw .pw-bt:disabled{opacity:.45;cursor:default}
#pw .pw-info{background:#F7F9FB;border:1px solid #DDE3EA;border-radius:10px;padding:10px;margin-bottom:12px}
#pw .pw-row label{display:flex;flex-direction:column;font-size:13px;color:#555;gap:3px}
#pw .pw-row.two{display:flex;gap:8px;margin-top:8px}#pw .pw-row.two label{flex:1}
#pw .pw-info input,#pw .pw-info select{font-size:16px;min-height:44px;padding:6px 10px;border:1px solid #BFC9D4;border-radius:8px;width:100%;box-sizing:border-box;font-family:inherit}
#pw .pw-phbtn{margin-top:8px;width:100%;min-height:42px;border:1px solid #BFC9D4;background:#fff;border-radius:8px;font-size:14px;cursor:pointer}
#pw .pw-ph{width:100%;margin-top:8px;border-radius:8px}
#pw .pw-note{background:#FFF2CC;border:1px solid #F4B183;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
#pw .pw-sec{border-top:1px solid #E5EAF0;padding-top:8px;margin-top:10px}
#pw .pw-sec h4{margin:4px 0 2px;font-size:16px;color:#1F3864;display:flex;align-items:center;gap:6px}
#pw .pw-sec .pw-q{font-size:14px;margin:2px 0 8px}
#pw .pw-num{background:#1F3864;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
#pw .pw-grp{font-size:11px;color:#8497B0;font-weight:400}
#pw .pw-res{display:flex;gap:14px;align-items:center;border:3px solid;border-radius:12px;padding:12px}
#pw .pw-big{color:#fff;font-size:34px;font-weight:900;border-radius:12px;min-width:70px;height:70px;display:flex;align-items:center;justify-content:center}
#pw .pw-rt{font-size:13px;color:#555}#pw .pw-rl{font-size:20px;font-weight:800}#pw .pw-rs{font-size:13px;color:#555;margin-top:2px}
#pw .pw-hints{display:flex;flex-direction:column;gap:6px}
#pw .pw-hint{background:#F3F8FD;border-left:4px solid #2F75B5;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.45}
#pw .pw-tb{border-collapse:collapse;width:100%;font-size:14px}#pw .pw-tb td{border-bottom:1px solid #E5EAF0;padding:6px 4px}#pw .pw-tb td.b{text-align:right;font-weight:700}
.pwbtn{background:#2F75B5;color:#fff;border:0;border-radius:6px;padding:5px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap;margin-top:3px}
.pwbtn.done{background:#548235}
#pw .pw-afig{width:46px;flex:none}#pw .pw-afig svg{width:46px;height:auto}
@media(min-width:700px){#pw .pw-opts.n2{grid-template-columns:repeat(2,minmax(0,260px))}}/*PW-CSS-END*/

/*FV-CSS*/#fv{position:fixed;inset:0;z-index:990;background:#E9EEF4;display:flex;justify-content:center;font-size:15px;overflow:hidden}
#fv *{box-sizing:border-box}
#fv .fv-box{width:100%;max-width:680px;height:100%;display:flex;flex-direction:column;background:#F6F8FB;overflow:hidden}
#fv .fv-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1F3864;color:#fff;min-height:56px}
#fv .fv-tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
#fv .fv-tt b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#fv .fv-tt span{font-size:12.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fv .fv-pc,#fv .fv-back{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:8px;min-height:40px;padding:0 12px;font-size:14px;cursor:pointer;flex:none;font-family:inherit}
#fv .fv-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid #DDE3EA}
#fv .fv-tools select,#fv .fv-q{min-height:44px;font-size:16px;border:1px solid #BFC9D4;border-radius:8px;padding:0 10px;width:100%;background:#fff;font-family:inherit}
#fv .fv-q{grid-column:1 / -1}
#fv .fv-only{display:flex;align-items:center;gap:6px;border:1.5px solid #BFC9D4;border-radius:8px;padding:0 10px;font-size:14px;white-space:nowrap;min-height:44px}
#fv .fv-only.on{border-color:#C00000;color:#C00000;font-weight:700}#fv .fv-only input{width:20px;height:20px}
#fv .fv-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;-webkit-overflow-scrolling:touch}
#fv .fv-card{display:block;width:100%;text-align:left;background:#fff;border:1px solid #DDE3EA;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:inherit}
#fv .fv-card:active{background:#EAF2FB}
#fv .fv-c1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#fv .fv-id{font-weight:800;color:#1F3864}#fv .fv-proc{font-size:12.5px;color:#667}
#fv .fv-name{font-size:16.5px;font-weight:700;margin:3px 0 6px;line-height:1.3;word-break:keep-all}
#fv .fv-c3{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:13px}
#fv .fv-ar{color:#8497B0}
#fv .fv-g{display:inline-block;border-radius:12px;padding:2px 9px;font-size:13px;font-weight:700;background:#EDEFF2;color:#555}
#fv .fv-g상{background:#C00000;color:#fff}#fv .fv-g중{background:#FFC000;color:#222}#fv .fv-g하{background:#70AD47;color:#fff}
#fv .fv-st{margin-left:auto;font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px}
#fv .fv-st-r{background:#FDE2E2;color:#C00000}#fv .fv-st-y{background:#FFF2CC;color:#7F6000}#fv .fv-st-b{background:#DDEBF7;color:#1F3864}#fv .fv-st-g{background:#E2EFDA;color:#375623}
#fv .fv-pose{font-size:12.5px;color:#2F75B5;margin-left:auto}
#fv .fv-empty{text-align:center;color:#888;padding:40px 0}
#fv .fv-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-bottom:1px solid #DDE3EA}
#fv .fv-tabs button{min-height:48px;border:0;background:#fff;font-size:16px;font-weight:700;color:#667;border-bottom:3px solid transparent;cursor:pointer;position:relative;font-family:inherit}
#fv .fv-tabs button.on{color:#1F3864;border-bottom-color:#2F75B5}
#fv .fv-dot{position:absolute;top:10px;width:8px;height:8px;border-radius:50%;background:#C00000;margin-left:3px}
#fv .fv-cause{background:#fff;border-radius:8px;padding:8px 10px;font-size:14px;color:#333;margin-bottom:6px;line-height:1.45}
#fv .fv-lab{font-weight:700;color:#1F3864;margin:12px 0 6px;font-size:14.5px}#fv .fv-lab small{font-weight:400;color:#888}
#fv .fv-seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
#fv .fv-seg button{min-height:58px;border:1.5px solid #BFC9D4;background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 2px;cursor:pointer;font-family:inherit}
#fv .fv-seg b{font-size:18px}#fv .fv-seg span{font-size:10.5px;line-height:1.15;color:#555;word-break:keep-all;text-align:center}
#fv .fv-seg button.on{background:#2F75B5;border-color:#2F75B5}#fv .fv-seg button.on b,#fv .fv-seg button.on span{color:#fff}
#fv .fv-det{font-size:13px;color:#555;margin-top:5px}

#fv .fv-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end}
#fv label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:#555;min-width:0}
#fv input[type=text],#fv input[type=date],#fv textarea,#fv select{width:100%;min-height:44px;font-size:16px;border:1px solid #BFC9D4;border-radius:8px;padding:6px 8px;background:#fff;font-family:inherit;min-width:0}
#fv textarea{resize:vertical;line-height:1.4}
#fv .fv-big{min-height:64px;border:2px solid #2F75B5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
#fv .fv-big b{font-size:17px;color:#1F3864}#fv .fv-big span{font-size:13px;color:#2F75B5}
#fv .fv-done{min-height:44px;border:2px solid #548235;color:#548235;background:#fff;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#fv .fv-ph{background:#fff;border:1px dashed #BFC9D4;border-radius:10px;min-height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#999;margin-bottom:6px}
#fv .fv-ph img{max-width:100%;max-height:24vh;display:block}
#fv .fv-btn{min-height:46px;border:1.5px solid #2F75B5;color:#2F75B5;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;font-family:inherit}
#fv .fv-btn.p{background:#2F75B5;color:#fff}#fv .fv-btn.d{border-color:#C00000;color:#C00000}
#fv .fv-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#fv .fv-three .fv-btn{margin-bottom:6px}
#fv .fv-saved{text-align:center;color:#99A;font-size:12px;margin:16px 0 4px}
#fv .fv-note{background:#FFF2CC;border-radius:8px;padding:6px 8px;font-size:13px;margin-top:6px}
#fv .fv-foot{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #DDE3EA}
#fv .fv-foot button{min-height:52px;border:2px solid #2F75B5;background:#fff;color:#2F75B5;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
#fv .fv-foot button:disabled{opacity:.35}#fv .fv-foot span{font-size:13px;color:#667}
.fvbtn{position:fixed;right:14px;bottom:14px;z-index:50;background:#2F75B5;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media print{.fvbtn,#fv{display:none!important}}

 if(!P||P.kind!=="msd-changes"){ return {err:"변경분 파일이 아닙니다. 휴대폰의 '변경분 보내기'로 만든 파일을 고르세요."}; }
 if(P.app!==KEY)warn.push("다른 웹앱 파일(사업장)에서 만든 변경분입니다. 같은 번호의 칸에만 반영되니 내용을 꼭 확인하세요.");
 if((P.schema||1)>SCHEMA)warn.push("더 새로운 버전 웹앱에서 만든 파일입니다. 이 웹앱에 없는 칸은 건너뜁니다.");
 (P.items||[]).forEach(([k,v,t,isArr])=>{ const seg=keySeg(k); let pre=[], missing=null;
  for(const s of seg){ pre.push(s); if(s[0]==="#"&&!keyResolve(pre.join("."),false)){ missing=pre.join("."); break; } }
  if(missing){ if(P.els&&P.els[missing]){ news[missing]=news[missing]||{k:missing,el:JSON.parse(P.els[missing]),n:0}; news[missing].n++; } return; }
  const cur=keyGet(k); if(String(cur??"")===String(v??""))return;
  const mine=(S._mt||{})[k]||0, newer=t>=mine; const L=syLabel(k);
  const ord=/(^|\.)@\d+/.test(k); rows.push({k,v,t,isArr,cur,mine,newer,ord,on:newer&&!ord,...L}); });
 Object.values(news).forEach(x=>{ x.on=true; const a=keySeg(x.k); x.arr=a.slice(0,-1).join("."); x.id=a[a.length-1].slice(1); x.name=x.el.name||x.el.task||x.el.cause||""; });
 rows.sort((a,b)=>a.who<b.who?-1:a.who>b.who?1:0);
 return {rows,news:Object.values(news),warn,file:file.name,from:P.dev||"이름 없음",at:P.at,n:(P.items||[]).length}; }
function syRender(){ let el=document.getElementById("sy"); if(!SY){ if(el)el.remove(); return; } if(!el){ el=document.createElement("div"); el.id="sy"; el.className="xi-like"; document.body.appendChild(el); }

 const fm=t=>{ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

 SY={rows:Object.values(by).sort((a,b)=>a.who<b.who?-1:a.who>b.who?1:0),news:Object.values(nw),warn:[...new Set(ok.flatMap(x=>x.warn))],file:ok.map(x=>x.file).join(", "),from:[...new Set(ok.map(x=>x.from))].join(", "),at:Math.max(...ok.map(x=>x.at||0))};
 syRender(); }
function syApply(){ SY_UNDO=JSON.stringify(S); beforeBig(`변경분 반영 전 (${SY.from})`); let n=0; const keep={};
 SY.news.filter(x=>x.on).forEach(x=>{ const r=keyResolve(x.arr,true); if(r){ const arr=r.o[r.k]; if(Array.isArray(arr)&&!arr.some(e=>e&&e.id===x.id)){ arr.push(x.el); n++; } } });
 SY.rows.filter(r=>r.on).forEach(r=>{ if(keySet(r.k,r.v,r.isArr)){ keep[r.k]=r.t; n++; } });
 try{ mtTrack(); Object.assign(S._mt,keep); }catch(e){ logErr("변경분 반영",e); }
 S._sync=Object.assign({},S._sync); S._sync.recv=[{from:SY.from,at:Date.now(),n}].concat(S._sync.recv||[]).slice(0,30);

function phWalk(o,fn,path=""){ if(o&&typeof o==="object"){ for(const k in o){ if(!path&&MT_SKIP.has(k))continue; const v=o[k]; if(typeof v==="string"&&v.startsWith("data:image"))fn(o,k,v); else if(v&&typeof v==="object")phWalk(v,fn,path+k+"."); } } }
function phStats(){ let n=0,b=0,big=0; phWalk(S,(o,k,v)=>{ n++; b+=v.length*0.75; if(v.length>240000)big++; }); return {n,mb:b/1048576,big}; }
function phShrinkUrl(u,max,q){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); c.getContext("2d").drawImage(im,0,0,c.width,c.height); const out=c.toDataURL("image/jpeg",q); res(out.length<u.length?out:u); }; im.onerror=()=>res(u); im.src=u; }); }
async function phShrinkAll(){ const st=phStats(); if(!st.n){ alert("저장된 사진이 없습니다."); return; }
 if(!confirm(`사진 ${st.n}장(${st.mb.toFixed(1)} MB)을 긴 변 800px·보통 화질로 다시 줄입니다. 보고서 인쇄에는 충분한 크기이며, 줄이기 전 자료는 복원 지점에 보관됩니다. 계속할까요?`))return;
 await snapAdd("사진 줄이기 전"); const jobs=[]; phWalk(S,(o,k,v)=>{ if(v.length>120000)jobs.push(phShrinkUrl(v,800,0.72).then(u=>{ o[k]=u; })); }); await Promise.all(jobs);
 const af=phStats(); save(); S.ui.phMsg=`사진 ${jobs.length}장을 줄였습니다: ${st.mb.toFixed(1)} MB → ${af.mb.toFixed(1)} MB`; render(); }
function phCard(){ const st=phStats(); if(!st.n)return "";
 return `<div class="card"><h4>사진 용량</h4><p>저장된 사진 <b>${st.n}장 · ${st.mb.toFixed(1)} MB</b>${st.big?` (큰 사진 ${st.big}장)`:""}. 휴대폰 저장 공간이나 백업 파일이 커지면 사진을 다시 줄이세요. 사진을 지우지는 않습니다.</p><div class="row"><button class="btn" data-phshrink="1">사진 다시 줄이기</button></div>${S.ui.phMsg?`<p class="memo"><b>${esc(S.ui.phMsg)}</b></p>`:""}</div>`; }
